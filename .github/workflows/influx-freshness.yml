name: InfluxDB freshness check

# Runs hourly and pings healthchecks.io.
# Pair with healthchecks.io Period = 1 hour, Grace = 2 hours.
#
# Why the grace is twice the period: GitHub's scheduler has no reserved
# capacity -- scheduled runs queue behind every push and PR on the
# platform -- and a fire that is not picked up before the NEXT fire is due
# is dropped without retry. Measured here: 2 runs out of an expected 16
# overnight. A 1-hour grace therefore alerts about GitHub rather than about
# the data. A 2-hour grace tolerates one dropped run and still catches a
# genuinely dead monitor.
#
# This does NOT slow down detection of stale data: whenever a run does
# happen, it sends the /fail ping immediately.
#
# The minute is deliberately NOT near :00. GitHub documents the start of
# every hour as peak load, so a run scheduled there joins the longest
# queue. Moving the minute earlier does not buy wiggle room -- the gap to
# the next fire is 60 minutes whatever minute you pick -- it only picks a
# busier queue. :23 is arbitrary but mid-hour and quieter.
#
# If drops stay frequent, the lever that actually helps is the INTERVAL:
# "23 */2 * * *" gives a fire two hours to be picked up instead of one.
# The reliable answer is cron on an always-on machine; see the README.
#
# NOTE: GitHub disables scheduled workflows in a repository with no commit
# activity for 60 days. When that happens the pings simply stop, and
# healthchecks.io alerts you -- which is exactly what a dead man's switch
# is for. If you see "no ping received" with no other explanation, check
# whether this workflow was auto-disabled.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: "Override the staleness threshold for a manual run"
        required: false
        default: ""

permissions:
  contents: read

# No `concurrency:` block here, deliberately. GitHub cancels a PENDING run
# when another joins the same concurrency group, so with delayed scheduled
# runs piling up it discards fires that would otherwise have completed. The
# job takes about 8 seconds, so overlapping runs are not a real risk and
# serialising them buys nothing.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # checkout@v4 runs on Node 20, which GitHub has deprecated; v5 targets
      # Node 24.
      - name: Check out the repository
        uses: actions/checkout@v5

      # No setup-python step. The runner image already ships Python 3, and
      # this script imports nothing outside the standard library, so the
      # action only added a second deprecated dependency and a few seconds
      # of runtime. Fewer actions, fewer deprecation treadmills.

      - name: Check bucket freshness
        env:
          # Host, org and bucket live in SECRETS rather than variables:
          # repository variables are readable by anyone who can read the
          # repo (everyone, if it is public), and GitHub masks secrets in
          # job logs. The hostname is not truly secret -- it is public DNS
          # -- but there is no reason to publish it either.
          INFLUX_HOST: ${{ secrets.INFLUX_HOST }}
          INFLUX_ORG: ${{ secrets.INFLUX_ORG }}
          INFLUX_BUCKET: ${{ secrets.INFLUX_BUCKET }}
          INFLUX_TOKEN: ${{ secrets.INFLUX_READ_TOKEN }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
          INFLUX_PORT: ${{ vars.INFLUX_PORT }}
          INFLUX_MAX_AGE_MINUTES: ${{ github.event.inputs.max_age_minutes || vars.INFLUX_MAX_AGE_MINUTES }}
          # Replace hostname, bucket and measurement names with stable
          # pseudonyms in the log and in the healthchecks.io ping body, so
          # neither names the data source. Run the script locally without
          # --redact to see which pseudonym is which.
          INFLUX_REDACT: "1"
        run: |
          python3 influx_freshness_check.py \
            --no-fail-on-stale \
            --ignore-measurement diag_test \
            --ignore-measurement conn_test \
            --ignore-measurement manual_test \
            --ignore-measurement test

# --no-fail-on-stale: stale data still sends the /fail ping, but the job
# exits 0. A red run here therefore means THE CHECK is broken (cannot reach
# InfluxDB, token rejected, bucket unreadable), not that the feed is down.
# Without this, a feed that stays down for days produces an hourly red cross
# plus GitHub's own failure notifications on top of healthchecks.io -- two
# alerting systems for one fact, and an Actions tab too red to read.

# The ignored measurements are connection-test leftovers that get written
# by hand at random times and would otherwise flap the alarm. Adjust the
# list to match whatever test measurements exist in your own bucket.
#
# This is a denylist, so a NEW measurement appearing in the bucket is
# monitored automatically. To monitor only known feeds instead, replace the
# ignore flags with one --measurement NAME per feed -- safer against noise,
# but a new feed is then silently unmonitored.
